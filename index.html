<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="inventory-manifest.json">
<title>Essensuals Inventory</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:5}header b{font-size:21px;letter-spacing:.5px}header small{display:block;color:#bbb;margin-top:4px}
.wrap{max-width:900px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000d}.card strong{font-size:22px;display:block}.card span{font-size:12px;color:#666}
.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}input,select,button{font:inherit;border-radius:10px;border:1px solid #ddd;padding:11px;background:#fff}input{flex:1;min-width:160px}button{background:#111;color:#fff;border:0;font-weight:600;cursor:pointer}.secondary{background:#fff;color:#111;border:1px solid #ddd}.danger{background:#b00020}
.list{display:grid;gap:10px}.item{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000d}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:16px}.meta{font-size:12px;color:#666;margin-top:4px}.stock{font-size:22px;font-weight:800}.low{color:#b00020}.good{color:#187a32}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:700px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:#666}.field input,.field select{width:100%;background:#fafafa}
.empty{text-align:center;padding:35px;color:#777}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:30px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:600px){.card{padding:10px}.card strong{font-size:18px}.toolbar>*{width:100%}.actions button{padding:10px 5px;font-size:13px}}
</style></head>
<body><header><b>TONI&GUY ESSENSUALS</b><small>RMV 2nd Stage • Salon Inventory</small></header>
<main class="wrap"><div class="cards"><div class="card"><strong id="total">0</strong><span>Total Products</span></div><div class="card"><strong id="lowCount">0</strong><span>Low Stock</span></div><div class="card"><strong id="stockUnits">0</strong><span>Total Units</span></div></div>
<div class="toolbar"><input id="search" placeholder="Search products…"><select id="filter"><option value="all">All Products</option><option value="low">Low Stock</option><option value="good">In Stock</option></select><button onclick="openModal()">＋ Add Product</button></div>
<div id="list" class="list"></div></main>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="modalTitle">Add Product</h2><button class="secondary" onclick="closeModal()">✕</button></div><input type="hidden" id="editId">
<div class="field"><label>Product name</label><input id="name" placeholder="e.g. Shampoo 1L"></div>
<div class="field"><label>Brand</label><input id="brand" placeholder="Brand"></div>
<div class="field"><label>Category</label><select id="category"><option>Shampoo</option><option>Conditioner</option><option>Hair Colour</option><option>Developer</option><option>Styling</option><option>Skincare</option><option>Disposable</option><option>Other</option></select></div>
<div class="row"><div class="field" style="flex:1"><label>Current stock</label><input id="stock" type="number" min="0" step="0.01"></div><div class="field" style="flex:1"><label>Unit</label><select id="unit"><option>pcs</option><option>ml</option><option>L</option><option>g</option><option>kg</option></select></div></div>
<div class="field"><label>Minimum stock / reorder level</label><input id="min" type="number" min="0" step="0.01"></div>
<div class="row"><div class="field" style="flex:1"><label>Purchase price (₹)</label><input id="price" type="number" min="0" step="0.01"></div><div class="field" style="flex:1"><label>Supplier</label><input id="supplier" placeholder="Supplier name"></div></div>
<div class="actions"><button onclick="saveProduct()">Save Product</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='essensuals_inventory_v1';let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(products));render()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let shown=products.filter(p=>(p.name+' '+p.brand+' '+p.category).toLowerCase().includes(q)).filter(p=>f==='all'||(f==='low'?+p.stock<=+p.min:+p.stock>+p.min));
$('total').textContent=products.length;$('lowCount').textContent=products.filter(p=>+p.stock<=+p.min).length;$('stockUnits').textContent=products.reduce((a,p)=>a+(+p.stock||0),0);
$('list').innerHTML=shown.length?shown.map(p=>{let low=+p.stock<=+p.min;return `<div class="item"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.brand||'')} • ${esc(p.category)} • ${esc(p.unit)}</div></div><div class="stock ${low?'low':'good'}">${p.stock} ${esc(p.unit)}</div></div><div class="meta">Reorder at ${p.min} ${esc(p.unit)}${p.supplier?' • '+esc(p.supplier):''}${p.price?' • ₹'+Number(p.price).toLocaleString('en-IN'):''}</div><div class="actions"><button onclick="adjust('${p.id}',1)">＋ Stock</button><button onclick="adjust('${p.id}',-1)">− Use</button><button class="secondary" onclick="edit('${p.id}')">Edit</button><button class="danger" onclick="removeProduct('${p.id}')">Delete</button></div></div>`}).join(''):'<div class="empty">No products yet. Tap <b>Add Product</b> to start your inventory.</div>'}
function openModal(p=null){$('modal').classList.add('show');$('modalTitle').textContent=p?'Edit Product':'Add Product';$('editId').value=p?.id||'';$('name').value=p?.name||'';$('brand').value=p?.brand||'';$('category').value=p?.category||'Shampoo';$('stock').value=p?.stock??'';$('unit').value=p?.unit||'pcs';$('min').value=p?.min??'';$('price').value=p?.price??'';$('supplier').value=p?.supplier||'';$('name').focus()}
function closeModal(){$('modal').classList.remove('show')}
function saveProduct(){let name=$('name').value.trim();if(!name)return toast('Enter product name');let id=$('editId').value||crypto.randomUUID();let p={id,name,brand:$('brand').value.trim(),category:$('category').value,stock:+$('stock').value||0,unit:$('unit').value,min:+$('min').value||0,price:+$('price').value||0,supplier:$('supplier').value.trim()};let i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else products.push(p);persist();closeModal();toast('Product saved')}
function adjust(id,dir){let p=products.find(x=>x.id===id);if(!p)return;let n=prompt(dir>0?`Add stock (${p.unit})`:`Use stock (${p.unit})`,'1');if(n===null)return;let qty=Number(n);if(!Number.isFinite(qty)||qty<=0)return toast('Enter a valid quantity');p.stock=dir>0?+p.stock+qty:Math.max(0,+p.stock-qty);persist();toast(dir>0?'Stock added':'Stock used')}
function edit(id){let p=products.find(x=>x.id===id);if(p)openModal(p)}
function removeProduct(id){let p=products.find(x=>x.id===id);if(p&&confirm(`Delete ${p.name}?`)){products=products.filter(x=>x.id!==id);persist();toast('Product deleted')}}
$('search').oninput=render;$('filter').onchange=render;render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('inventory-sw.js').catch(()=>{});
</script></body></html>
